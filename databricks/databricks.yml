# Declarative Automation Bundle — medallion pipeline jobs
bundle:
  name: news-insight-engine

variables:
  catalog:
    description: Unity Catalog name
    default: news_insight
  cluster_id:
    description: Existing all-purpose or job cluster ID (dev)
    default: ""

workspace:
  host: ${env.DATABRICKS_HOST}

resources:
  jobs:
    news_insight_medallion:
      name: news_insight_medallion_${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingest
          python_wheel_task:
            package_name: news_insight_engine
            entry_point: databricks.src.bronze_ingest
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--staging_path"
              - "{{job.parameters.staging_path}}"
              - "--ingestion_date"
              - "{{job.parameters.ingestion_date}}"
          existing_cluster_id: ${var.cluster_id}
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          python_wheel_task:
            package_name: news_insight_engine
            entry_point: databricks.src.silver_transform
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--ingestion_date"
              - "{{job.parameters.ingestion_date}}"
          existing_cluster_id: ${var.cluster_id}
        - task_key: gold_chunking
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: news_insight_engine
            entry_point: databricks.src.gold_chunking
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--ingestion_date"
              - "{{job.parameters.ingestion_date}}"
          existing_cluster_id: ${var.cluster_id}
        - task_key: vector_upsert
          depends_on:
            - task_key: gold_chunking
          spark_python_task:
            python_file: ../vector/embed_job.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--ingestion_date"
              - "{{job.parameters.ingestion_date}}"
          existing_cluster_id: ${var.cluster_id}
      parameters:
        - name: staging_path
          default: ""
        - name: ingestion_date
          default: ""

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
